name: Build APK and Upload

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o guardian-monitor.zip -d extracted_project
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build with Gradle
        run: |
          cd extracted_project
          # البحث عن مكان وجود ملف gradlew وتنفيذ أمر البناء
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Found project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradlew not found in zip structure."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
