name: Build APK from Zip

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract guardian-monitor.zip
        run: |
          # فك ضغط الملف المرفوع تلقائياً
          unzip -o guardian-monitor.zip -d extracted_project
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          # البحث عن مجلد المشروع المفكوك وبدء البناء
          cd extracted_project
          if [ -d "guardian-monitor" ]; then
            cd guardian-monitor
          fi
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Searching for build files..."
            find . -name "gradlew"
          fi
