name: Build APK with Auto Gradle

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          if [ -f "guardian-monitor2.zip" ]; then
            unzip -o guardian-monitor2.zip -d extracted_project
          else
            mkdir -p extracted_project
            cp -r app src build.gradle settings.gradle gradle.properties extracted_project/ || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper and Build
        run: |
          cd extracted_project
          if [ -d "app" ]; then
            # إذا لم يكن ملف gradlew موجوداً، سنقوم بإنشائه أوتوماتيكياً لتجنب أي نقص
            if [ ! -f "gradlew" ]; then
              gradle wrapper
            fi
            
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: 'app' directory not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
